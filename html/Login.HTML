<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Connect - Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="logo">
        IPSConnect
    </div>

    <h1>Login</h1>

    <p class="subtitle">
        Login para continuar
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="numeroaluno@escola.ipsantarem.pt">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="********">

        <button
            class="btn-primary"
            type="submit">

            Entrar

        </button>

       <button
    class="btn-secondary"
    type="button"
    onclick="window.location.href='ForgetPassword.HTML'">

    Esqueceste-te da palavra-passe?

</button>

    </form>

    <div class="register-link">

        Ainda não tens conta?

        <a style="color:red" href="CreateAccount.HTML">

            Criar Conta

        </a>

    </div>

<script src="../js/app.js"></script>

</body>
</html>
<script src="../js/theme.js"></script>
<script type="module"
src="../Database/auth.js">
</script>
