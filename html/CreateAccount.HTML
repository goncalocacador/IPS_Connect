<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Connect - Criar Conta</title>

    <link rel="stylesheet" href="../css/createAccount.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="register-container">

    <div class="logo">
        IPSConnect
    </div>

    <h1>Criar Nova<br>Conta</h1>

    <p class="login-link">
        Já registado?
        <a href="Login.HTML">
            Faz Login aqui
        </a>
    </p>

    <form id="registerForm">

        <label>NAME</label>
        <input type="text"
               id="nome"
               placeholder="Jiara Martins">

        <label>EMAIL</label>
        <input type="email"
               id="email"
               placeholder="hello@reallygreatsite.com">

        <label>PASSWORD</label>
        <input type="password"
               id="password"
               placeholder="******">

        <label>DATA DE ANIVERSÁRIO</label>
        <input type="date"
               id="dataNascimento">

        <label>FUNÇÃO</label>

        <select id="perfilAcademico">

            <option>
                Select
            </option>

            <option>
                Estudante IPS
            </option>

            <option>
                Trabalhador-Estudante
            </option>

            <option>
                Aluno Internacional
            </option>

        </select>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>
<script src="../js/theme.js"></script>
<script type="module"
src="../Database/auth.js">
</script>

</body>

</html>
