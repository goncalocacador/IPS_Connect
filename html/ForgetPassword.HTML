<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Connect - Esquecer Password</title>

    <link rel="stylesheet" href="../css/forgetPassword.css">
</head>

<body>

    <div class="forgot-container">

        <div class="logo">
            IPSConnect
        </div>

        <h1>Esquecer<br>Password</h1>

        <p class="subtitle">
            Nova Password
        </p>

        <form id="forgotPasswordForm">

            <label>Email</label>

            <input
                type="email"
                id="resetEmail"
                placeholder="hello@reallygreatsite.com"
                required>

            <button type="submit">
                Enviar
            </button>

        </form>

        <div class="back-link">

            <a style="color:red;" href="Login.HTML">
                Voltar ao Login
            </a>

        </div>

    </div>
<script src="../js/theme.js"></script>
    <script type="module"
        src="../Database/auth.js">
    </script>

</body>

</html>
